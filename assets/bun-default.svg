<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Bun the mascot - placeholder for Float app -->
  
  <!-- Head -->
  <circle cx="50" cy="45" r="22" fill="#F5E8E0" stroke="#2C2C24" stroke-width="1.5"/>
  
  <!-- Left ear -->
  <ellipse cx="35" cy="15" rx="8" ry="20" fill="#F5E8E0" stroke="#2C2C24" stroke-width="1.5"/>
  <ellipse cx="35" cy="20" rx="4" ry="15" fill="#FFB3C1"/>
  
  <!-- Right ear -->
  <ellipse cx="65" cy="15" rx="8" ry="20" fill="#F5E8E0" stroke="#2C2C24" stroke-width="1.5"/>
  <ellipse cx="65" cy="20" rx="4" ry="15" fill="#FFB3C1"/>
  
  <!-- Eyes -->
  <circle cx="42" cy="40" r="2.5" fill="#2C2C24"/>
  <circle cx="58" cy="40" r="2.5" fill="#2C2C24"/>
  
  <!-- Eye shine (happy) -->
  <circle cx="43" cy="38" r="0.8" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="59" cy="38" r="0.8" fill="#FFFFFF" opacity="0.8"/>
  
  <!-- Nose -->
  <circle cx="50" cy="52" r="1.8" fill="#FFB3C1"/>
  
  <!-- Mouth (smile) -->
  <path d="M 50 52 Q 46 57 42 55" stroke="#2C2C24" stroke-width="1" fill="none" stroke-linecap="round"/>
  <path d="M 50 52 Q 54 57 58 55" stroke="#2C2C24" stroke-width="1" fill="none" stroke-linecap="round"/>
  
  <!-- Body -->
  <ellipse cx="50" cy="75" r="16" ry="20" fill="#F5E8E0" stroke="#2C2C24" stroke-width="1.5"/>
  
  <!-- Left foot -->
  <ellipse cx="40" cy="92" rx="6" ry="7" fill="#FFB3C1" stroke="#2C2C24" stroke-width="1"/>
  
  <!-- Right foot -->
  <ellipse cx="60" cy="92" rx="6" ry="7" fill="#FFB3C1" stroke="#2C2C24" stroke-width="1"/>
</svg>
